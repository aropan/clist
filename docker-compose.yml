services:
  prod:
    build:
      context: .
      target: prod
      provenance: disabled=true
    networks:
      clist_network:
        ipv4_address: 10.42.0.102
    volumes:
      - ./src/.env.prod:/usr/src/clist/.env.prod:ro
      - ./src/pyclist/conf.py:/usr/src/clist/pyclist/conf.py:ro
      - static_files:/usr/src/clist/staticfiles/
      - media_files:/usr/src/clist/mediafiles/
      - shared_files:/usr/src/clist/sharedfiles/
      - redis_data:/var/lib/redis/
      - ./logs/production:/usr/src/clist/logs/
      - ./legacy/logs/:/usr/src/clist/logs/legacy/
      - ./logs/postgres/:/usr/src/clist/logs/postgres/
      - ./legacy/api/:/usr/src/clist/legacy/api/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - db_conf
      - monitoring_conf
    restart: unless-stopped
  dev:
    build:
      context: .
      target: dev
      provenance: disabled=true
    networks:
      clist_network:
        ipv4_address: 10.42.0.103
    volumes:
      - ./src/:/usr/src/clist/
      - ./src/static:/usr/src/clist/staticfiles/
      - media_files:/usr/src/clist/mediafiles/
      - shared_files:/usr/src/clist/sharedfiles/
      - ./logs/development:/usr/src/clist/logs/
      - ./legacy/logs/:/usr/src/clist/logs/legacy/
      - ./logs/postgres/:/usr/src/clist/logs/postgres/
      - ./legacy/api/:/usr/src/clist/legacy/api/
    ports:
      - 127.0.0.1:10042:10042
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - db_conf
      - monitoring_conf
    mem_limit: 1g
    restart: unless-stopped
  redis:
    image: redis:8-trixie
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - clist_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  legacy:
    build:
      context: .
      dockerfile: legacy/Dockerfile
      provenance: disabled=true
    networks:
      clist_network:
        ipv4_address: 10.42.0.104
    volumes:
      - ./legacy:/usr/src/legacy/
      - ./src/scripts:/usr/src/legacy/scripts:ro
      - shared_files:/sharedfiles/
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_conf
      - monitoring_conf
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:9
    networks:
      - clist_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    env_file:
      - ./.env.db
    environment:
      - PGADMIN_CONFIG_SESSION_COOKIE_SECURE=True
      - GUNICORN_CMD_ARGS=--forwarded-allow-ips="*"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  bugsink:
    image: bugsink/bugsink:2
    networks:
      - clist_network
    volumes:
      - ./config/bugsink/clist_settings.py:/app/clist_settings.py:ro
    environment:
      - DJANGO_SETTINGS_MODULE=clist_settings
    env_file:
      - ./.env.bugsink
    depends_on:
      db:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    restart: unless-stopped
  healthchecks:
    image: healthchecks/healthchecks:v4.3
    networks:
      - clist_network
    volumes:
      - ./config/healthchecks/local_settings.py:/opt/healthchecks/hc/local_settings.py:ro
      # Directory (not single-file) mount so file replacements are seen live.
      - ./config/healthchecks:/opt/healthchecks/provisioning:ro
    env_file:
      - ./.env.healthchecks
    depends_on:
      db:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 384m
    restart: unless-stopped
  db:
    build:
      context: .
      target: postgres
      provenance: disabled=true
    networks:
      clist_network:
        ipv4_address: 10.42.0.105
    volumes:
      - postgres_data:/var/lib/postgresql/
      - ./src/scripts/:/usr/src/clist/scripts/
      - ./logs/postgres/:/var/log/
    env_file:
      - ./.env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --quiet --host 127.0.0.1 --port 5432 --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    shm_size: 4GB
    restart: unless-stopped
  backup:
    build:
      context: .
      target: backup
      provenance: disabled=true
    profiles:
      - tools
    networks:
      - clist_network
    volumes:
      - ${CLIST_BACKUP_DIR:-/var/backups/clist}:/backups
    env_file:
      - ./.env.db
    environment:
      - BACKUP_ROOT=/backups
      - BACKUP_DISPLAY_ROOT=${CLIST_BACKUP_DIR:-/var/backups/clist}
    depends_on:
      db:
        condition: service_healthy
    init: true
  nginx:
    build:
      context: .
      target: nginx
      provenance: disabled=true
    networks:
      clist_network:
        ipv4_address: 10.42.0.101
    volumes:
      - static_files:/staticfiles/
      - media_files:/mediafiles/
      - ./legacy:/usr/src/legacy/
      - ./config/nginx/conf.d:/etc/nginx/conf.d/
      - certbot_www:/var/www/certbot/
      - certbot_conf:/etc/letsencrypt/
      - ./logs/nginx:/var/log/
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
  certbot:
    image: certbot/certbot:latest
    networks:
      - clist_network
    volumes:
      - ./logs/letsencrypt:/var/log/letsencrypt
      - certbot_www:/var/www/certbot/
      - certbot_conf:/etc/letsencrypt/
    depends_on:
      - nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --max-log-backups 14; sleep 1d & wait $${!}; done;'"
    restart: unless-stopped
  netdata:
    image: netdata/netdata:v2
    networks:
      - clist_network
    hostname: netdata.clist.by
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - ./.env.netdata
    restart: unless-stopped
  loki:
    image: grafana/loki:3.7
    networks:
      - clist_network
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./config/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.18.0
    networks:
      - clist_network
    command:
      - run
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - /etc/alloy/config.alloy
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs/nginx/nginx:/var/log/nginx:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.1
    networks:
      - clist_network
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    env_file:
      - ./.env.grafana
    depends_on:
      - loki
      - alloy
    restart: unless-stopped

networks:
  clist_network:
    enable_ipv6: false
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-clist
    name: clist
    ipam:
      config:
        - subnet: 10.42.0.0/24

secrets:
  db_conf:
    file: ./.env.db
  monitoring_conf:
    file: ./.env.monitoring

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/postgres_data
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/redis_data
  pgadmin_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/pgadmin
  static_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/static_files
  media_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/media_files
  certbot_www:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/certbot_www
  certbot_conf:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/certbot_conf
  netdata_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/netdata/config
  netdata_lib:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/netdata/lib
  netdata_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/netdata/cache
  shared_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/shared_files
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/grafana_data
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/loki_data
  alloy_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/alloy_data
