# =============================================================================
# Ruff Configuration
# =============================================================================

# Set the maximum line length to 120 characters
line-length = 120

# Keep CLI, editor, and CI formatting results identical
required-version = "==0.16.2"

# Match the production Python version
target-version = "py314"

# Directories to exclude from linting and formatting
extend-exclude = [
    ".agents", # Skill documentation contains illustrative, intentionally unformatted snippets
    "*/migrations", # Ignore Django migrations
]

[lint]
# Enable preview features for linting
preview = true

# Rules to enable
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (basic syntax/logic errors)
    "I",   # isort (automatically sort imports)

    # --- Useful additions for a pet project ---
    "UP",  # pyupgrade (keep python modern, e.g. updating type hints)
    "B",   # flake8-bugbear (finds common bugs and design issues)
    "SIM", # flake8-simplify (suggests simpler alternatives for your code)
    "C4",  # flake8-comprehensions (helps write better list/dict comprehensions)

    # --- Advanced / Framework specific ---
    "RUF", # Ruff-specific rules (catches common mistakes)
    "RET", # flake8-return (makes returns more readable and logical)
    "DJ",  # flake8-django (rules for Django projects)
    "PT",  # flake8-pytest-style (if using pytest)
]

# Rules to ignore
ignore = [
    "whitespace-before-punctuation", # E203: often conflicts with formatters
    "module-import-not-at-top-of-file", # E402
    "zip-without-explicit-strict", # B905
    "unnecessary-assign", # RET504
]

# Rules that Ruff shouldn't try to fix automatically
unfixable = [
    "unused-import", # F401: don't auto-remove imports while developing a file
]

# Per-file ignores allow you to ignore specific rules for specific files
[lint.per-file-ignores]
# Allow unused imports in __init__.py files
"__init__.py" = ["unused-import"]
# IPython injects the configuration object before evaluating this file
"config/ipython_config.py" = ["undefined-name"]
# Allow long lines in Django migrations
"*/migrations/*" = ["line-too-long"]

[format]
# Enable preview features for formatting
preview = true

# Use double quotes for strings (standard Python convention)
quote-style = "double"

# Indent with spaces
indent-style = "space"
