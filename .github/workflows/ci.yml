name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install project tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.7.13
          install: true
          cache: true

      - name: Check Python lint
        run: mise run lint-python

      - name: Check Python formatting
        run: mise run check-python

      - name: Check frontend formatting
        run: mise run check-frontend

      - name: Check PHP formatting
        run: mise run check-php

      - name: Run standalone script tests
        run: >-
          uv run --no-project --python 3.14
          --with pytest==9.1.1
          --with rich==15.0.0
          --with google-auth-oauthlib==1.4.0
          pytest -q src/scripts/tests
