name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          install: true
          cache: true

      - name: Check Python for critical errors
        run: ruff check --select E9,F63,F7,F82 .

      - name: Check Python formatting
        run: mise run check-python

      - name: Check frontend formatting
        run: mise run check-frontend

      - name: Check PHP formatting
        run: mise run check-php

      - name: Run standalone regression tests
        run: >-
          uv run --no-project --with pytest==9.1.1 pytest -q
          src/scripts/tests/test_configure.py
          src/scripts/tests/test_patch_python_dependencies.py
