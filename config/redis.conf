# By default Redis does not run as a daemon. Use 'yes' if you need it.
# Note that Redis will write a pid file in /var/run/redis.pid when daemonized.
daemonize no

# Persist production RQ state outside the application container.
dir /var/lib/redis
dbfilename dump.rdb
save 3600 1
save 300 100
save 60 10000
appendonly no
